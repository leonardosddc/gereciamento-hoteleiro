<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Gerenciamento Hoteleiro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        .login-container h2 { color: #333; margin-bottom: 20px; }
        .login-container p { margin-bottom: 15px; text-align: left; }
        .login-container input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 5px; }
        .btn-login { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; }
        .btn-login:hover { background-color: #218838; }
        .errorlist { color: #dc3545; list-style: none; padding: 0; margin-bottom: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🏨 Acesso Restrito</h2>
        
        {% if form.errors %}
            <p style="color: #dc3545; font-weight: bold; text-align: center;">Usuário ou senha incorretos. Tente novamente.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <p>
                <label for="id_username">Usuário:</label>
                {{ form.username }}
            </p>
            <p>
                <label for="id_password">Senha:</label>
                {{ form.password }}
            </p>
            <button type="submit" class="btn-login">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
